# =============================================================================
# exp_06_resolution.yaml  —  Resolution × ADC preset grid search
#
# Purpose: Test how volume resolution (128³/196³/256³/native) interacts with
#          ADC aggressiveness. Higher resolutions may need more Gaussians
#          (aggressive ADC), while lower resolutions may not benefit from them.
#
# CASCADE: best from exp_02–05d
# Shape:   cloud_04_variant_0000
#
# Usage:
#   python experiment_runner.py --batch config/exp_06_resolution.yaml
# =============================================================================

global_overrides:
  volume:
    vdb_file: "cloud_04_variant_0000.vdb"
    up_axis: "-Z"
  rendering:
    smoke_color: [0.95, 0.95, 0.97]
    density_scale: 35.0
    density_curve: 0.8
    light_penetration: 0.25
    phase_g: 0.3
    sun_color: [1.0, 0.95, 0.85]
    sun_intensity: 4.0
    ambient_color: [0.7, 0.75, 0.85]
    ambient_intensity: 0.45
  output:
    result_dir: "results/exp_06_resolution"
    snapshot_radius: 2.5

  # -- CASCADE ----------------------------------------------------------------
  gaussian_init:
    target_count: 15000
    density_weighted: false
    sigma_scale: 1.5
  training:
    adam_beta2: 0.95
    learning_rate_pos: 0.20
    learning_rate_scale: 0.005
    learning_rate_rotation: 0.02
    learning_rate_weight: 0.025
    loss_mode: 0
    ssim_weight: 0.2

experiments:


  # ===== Native resolution ====================================================

  - name: "res_native_aggressive"
    description: "Native VDB resolution + aggressive ADC -- full detail with maximum growth; tile_size=8, bigger tile capacity to fit in VRAM."
    volume:
      use_native_size: true
      tile_size: 8
      max_gaussians_per_tile: 512
    adc:
      clone_n_dense: 1600
      clone_n_sparse: 800
      aniso_n_split: 120
      grad_n_split: 120
      full_adc_every: 100
      prune_only_every: 50
      clone_weight_init_frac: 0.50
      clone_weight_min: 0.10
      clone_weight_max: 0.50

  - name: "res_native_calm"
    description: "Native VDB resolution + calm ADC -- full detail reference grid; tile_size=8, bigger tile capacity to fit in VRAM."
    volume:
      use_native_size: true
      tile_size: 8
      max_gaussians_per_tile: 512
    adc:
      clone_n_dense: 1600
      clone_n_sparse: 800
      aniso_n_split: 120
      grad_n_split: 120


  # ===== 128³ =================================================================

  - name: "res_128_calm"
    description: "128³ volume + calm ADC -- coarse grid, fewer voxels to cover; tests quality floor."
    volume:
      vol_size: 128
    adc:
      clone_n_dense: 1600
      clone_n_sparse: 800
      aniso_n_split: 120
      grad_n_split: 120

  - name: "res_128_aggressive"
    description: "128³ volume + aggressive ADC -- coarse grid with maximum Gaussian growth; tests if extra Gaussians help at low resolution."
    volume:
      vol_size: 128
    adc:
      clone_n_dense: 1600
      clone_n_sparse: 800
      aniso_n_split: 120
      grad_n_split: 120
      full_adc_every: 100
      prune_only_every: 50
      clone_weight_init_frac: 0.50
      clone_weight_min: 0.10
      clone_weight_max: 0.50

  # ===== 196³ (default) =======================================================

  - name: "res_196_calm"
    description: "196³ volume + calm ADC -- the default resolution baseline, same as exp_05d baseline."
    volume:
      vol_size: 196
    adc:
      clone_n_dense: 1600
      clone_n_sparse: 800
      aniso_n_split: 120
      grad_n_split: 120

  - name: "res_196_aggressive"
    description: "196³ volume + aggressive ADC -- default resolution with maximum growth, same as exp_05d vfast_weight_high."
    volume:
      vol_size: 196
    adc:
      clone_n_dense: 1600
      clone_n_sparse: 800
      aniso_n_split: 120
      grad_n_split: 120
      full_adc_every: 100
      prune_only_every: 50
      clone_weight_init_frac: 0.50
      clone_weight_min: 0.10
      clone_weight_max: 0.50

  # ===== 256³ =================================================================

  - name: "res_256_calm"
    description: "256³ volume + calm ADC -- finer grid (2.2x more voxels than 196³); tests if 15k Gaussians can handle higher detail."
    volume:
      vol_size: 256
    adc:
      clone_n_dense: 1600
      clone_n_sparse: 800
      aniso_n_split: 120
      grad_n_split: 120

  - name: "res_256_aggressive"
    description: "256³ volume + aggressive ADC -- finer grid with maximum growth; tests if higher resolution needs more Gaussians."
    volume:
      vol_size: 256
    adc:
      clone_n_dense: 1600
      clone_n_sparse: 800
      aniso_n_split: 120
      grad_n_split: 120
      full_adc_every: 100
      prune_only_every: 50
      clone_weight_init_frac: 0.50
      clone_weight_min: 0.10
      clone_weight_max: 0.50
