# =============================================================================
# exp_10_steps_native_aggressive.yaml -- Step-count sweep, aggressive ADC
#
# Purpose: every prior chapter-5 experiment used a fixed 3000-step training
#          budget. The Gaussian-count-over-time plot shows aggressive ADC
#          plateaus around step 1500-2000 (cloning/pruning equilibrium), so
#          3000 may already be past convergence. This sweep characterises
#          *quality* (not just count) over the step axis to answer: does the
#          aggressive/quality regime need 3000 steps, or is much less enough?
#
#          Grid concentrated in the early-step region where the count curve
#          showed the knee. {500, 1000, 1500, 2000, 3000} -- five rows.
#          The 3000-step row reproduces init_15k_native from exp_08 and acts
#          as the chapter-default reference.
#
# Cascade: identical to exp_08 init_15k_native, only training.max_steps varies.
#
# Note:    max_count / max_gaussians raised to 75000 for headroom in case the
#          count keeps drifting up past the chapter-default 3000.
#
# Usage:
#   python experiment_runner.py --batch config/exp_10_steps_native_aggressive.yaml
# =============================================================================

global_overrides:
  training:
    max_steps: 3000
    adam_beta2: 0.95
    learning_rate_pos: 0.20
    learning_rate_scale: 0.005
    learning_rate_rotation: 0.02
    learning_rate_weight: 0.025
    loss_mode: 0
    ssim_weight: 0.5
  volume:
    vdb_file: "cloud_04_variant_0000.vdb"
    up_axis: "-Z"
    use_native_size: true
    tile_size: 8
    max_gaussians_per_tile: 512
  rendering:
    smoke_color: [0.95, 0.95, 0.97]
    density_scale: 35.0
    density_curve: 0.8
    light_penetration: 0.25
    phase_g: 0.3
    sun_color: [1.0, 0.95, 0.85]
    sun_intensity: 4.0
    ambient_color: [0.7, 0.75, 0.85]
    ambient_intensity: 0.45
  output:
    result_dir: "results/exp_10_steps_native_aggressive"
    snapshot_radius: 2.5
    # Dense checkpoints for convergence trajectory across the long-step rows.
    # Entries past max_steps are silently ignored by the training loop; -1 = final.
    checkpoints: [0, 100, 300, 500, 1000, 1500, 2000, 2500, 3000, 4000, 5000, 6000, 7000, -1]
  gaussian_init:
    target_count: 15000
    density_weighted: false
    sigma_scale: 1.5
    max_count: 75000
  adc:
    max_gaussians: 75000
    clone_n_dense: 1600
    clone_n_sparse: 800
    aniso_n_split: 120
    grad_n_split: 120
    full_adc_every: 100
    prune_only_every: 50
    clone_weight_init_frac: 0.50
    clone_weight_min: 0.10
    clone_weight_max: 0.50


experiments:

  - name: "steps_500"
    description: "Aggressive ADC, 500 steps -- sub-knee."
    training: { max_steps: 500 }

  - name: "steps_1000"
    description: "Aggressive ADC, 1000 steps -- approaching the count knee."
    training: { max_steps: 1000 }

  - name: "steps_1500"
    description: "Aggressive ADC, 1500 steps -- knee of the count curve."
    training: { max_steps: 1500 }

  - name: "steps_2000"
    description: "Aggressive ADC, 2000 steps -- expected plateau onset."
    training: { max_steps: 2000 }

  - name: "steps_3000"
    description: "Aggressive ADC, 3000 steps -- chapter default, matches init_15k_native in exp_08."
    training: { max_steps: 3000 }

  - name: "steps_5000"
    description: "Aggressive ADC, 5000 steps -- mirrors calm 5000, probes where aggressive quality plateaus."
    training: { max_steps: 5000 }

  - name: "steps_8000"
    description: "Aggressive ADC, 8000 steps -- mirrors calm 8000, upper anchor."
    training: { max_steps: 8000 }
