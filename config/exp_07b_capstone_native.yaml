# =============================================================================
# exp_07b_capstone_native.yaml  —  Same as exp_07 but at native VDB resolution
#
# Purpose: Repeat the capstone comparison at each VDB's native resolution to
#          test how the cascade performs without downsampling losses.
#          Uses tile_size=8 + max_gaussians_per_tile=512 to fit in VRAM.
#
# CASCADE: full best config from exp_02–06
# Resolution: native (per VDB)
#
# Usage:
#   python experiment_runner.py --batch config/exp_07b_capstone_native.yaml
# =============================================================================

global_overrides:
  training:
    max_steps: 3000
  volume:
    use_native_size: true
    tile_size: 8
    max_gaussians_per_tile: 512
  output:
    result_dir: "results/exp_07b_capstone_native"

experiments:

  # ===== Cloud ================================================================

  - name: "baseline_cloud"
    description: "Cloud at native resolution with default config."
    volume:
      vdb_file: "cloud_04_variant_0000.vdb"
      up_axis: "-Z"
    rendering:
      smoke_color: [0.95, 0.95, 0.97]
      density_scale: 35.0
      density_curve: 0.8
      light_penetration: 0.25
      phase_g: 0.3
      sun_color: [1.0, 0.95, 0.85]
      sun_intensity: 4.0
      ambient_color: [0.7, 0.75, 0.85]
      ambient_intensity: 0.45
    output:
      snapshot_radius: 2.5

  - name: "calm_cloud"
    description: "Cloud at native resolution with full cascade + calm ADC."
    volume:
      vdb_file: "cloud_04_variant_0000.vdb"
      up_axis: "-Z"
    rendering:
      smoke_color: [0.95, 0.95, 0.97]
      density_scale: 35.0
      density_curve: 0.8
      light_penetration: 0.25
      phase_g: 0.3
      sun_color: [1.0, 0.95, 0.85]
      sun_intensity: 4.0
      ambient_color: [0.7, 0.75, 0.85]
      ambient_intensity: 0.45
    output:
      snapshot_radius: 2.5
    gaussian_init:
      target_count: 15000
      density_weighted: false
      sigma_scale: 1.5
    training:
      adam_beta2: 0.95
      learning_rate_pos: 0.20
      learning_rate_scale: 0.005
      learning_rate_rotation: 0.02
      learning_rate_weight: 0.025
      loss_mode: 0
      ssim_weight: 0.2
    adc:
      clone_n_dense: 1600
      clone_n_sparse: 800
      aniso_n_split: 120
      grad_n_split: 120

  - name: "aggressive_cloud"
    description: "Cloud at native resolution with full cascade + aggressive ADC."
    volume:
      vdb_file: "cloud_04_variant_0000.vdb"
      up_axis: "-Z"
    rendering:
      smoke_color: [0.95, 0.95, 0.97]
      density_scale: 35.0
      density_curve: 0.8
      light_penetration: 0.25
      phase_g: 0.3
      sun_color: [1.0, 0.95, 0.85]
      sun_intensity: 4.0
      ambient_color: [0.7, 0.75, 0.85]
      ambient_intensity: 0.45
    output:
      snapshot_radius: 2.5
    gaussian_init:
      target_count: 15000
      density_weighted: false
      sigma_scale: 1.5
    training:
      adam_beta2: 0.95
      learning_rate_pos: 0.20
      learning_rate_scale: 0.005
      learning_rate_rotation: 0.02
      learning_rate_weight: 0.025
      loss_mode: 0
      ssim_weight: 0.2
    adc:
      clone_n_dense: 1600
      clone_n_sparse: 800
      aniso_n_split: 120
      grad_n_split: 120
      full_adc_every: 100
      prune_only_every: 50
      clone_weight_init_frac: 0.50
      clone_weight_min: 0.10
      clone_weight_max: 0.50

