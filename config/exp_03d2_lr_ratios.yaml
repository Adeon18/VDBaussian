# =============================================================================
# exp_03d2_lr_ratios.yaml  —  Per-parameter LR ratios (iteration 2)
#
# Purpose: Refine the per-parameter LR ratios using results from exp_03d v1.
#          v1 findings: pos 4x best, rot 4x good, weight 4x no help,
#          scale 4x diverged, equal LRs bad.
#          This iteration maps the curve around winners (2x/8x), tests whether
#          reducing scale/weight LRs helps, and combines individual winners.
#
# CASCADE: fill in best from exp_02a, exp_02b, exp_03a, exp_03b, exp_03c
# Shape:   cloud_04_variant_0000
#
# Usage:
#   python experiment_runner.py --batch config/exp_03d2_lr_ratios.yaml
# =============================================================================

global_overrides:
  volume:
    vdb_file: "cloud_04_variant_0000.vdb"
    up_axis: "-Z"
  rendering:
    smoke_color: [0.95, 0.95, 0.97]
    density_scale: 35.0
    density_curve: 0.8
    light_penetration: 0.25
    phase_g: 0.3
    sun_color: [1.0, 0.95, 0.85]
    sun_intensity: 4.0
    ambient_color: [0.7, 0.75, 0.85]
    ambient_intensity: 0.45
  output:
    result_dir: "results/exp_03d2_lr_ratios"
    snapshot_radius: 2.5

  # -- CASCADE ----------------------------------------------------------------
  gaussian_init:
    target_count: 15000
    density_weighted: false
    sigma_scale: 1.5
  training:
    adam_beta2: 0.95

# Default LRs: pos=0.05, scale=0.01, rot=0.005, weight=0.05
# Multipliers below are relative to these defaults.

experiments:

  # ===== Reference experiments (from v1, for direct comparison) ===============

  - name: "baseline_1x"
    description: "All LRs at 1x default (pos=0.05, scale=0.01, rot=0.005, weight=0.05) -- baseline for all ratio experiments in this batch."

  - name: "ref_pos_4x"
    description: "Position LR at 4x (0.2), others default -- reference from v1 where this was the best individual improvement."
    training:
      learning_rate_pos: 0.2

  - name: "ref_rot_4x"
    description: "Rotation LR at 4x (0.02), others default -- reference from v1 where this gave good improvement."
    training:
      learning_rate_rotation: 0.02

  # ===== Position LR sweep (map curve around 4x winner) ======================

  - name: "pos_2x"
    description: "Position LR at 2x (0.1), others default -- tests whether 4x was already past the sweet spot or if improvement is monotonic."
    training:
      learning_rate_pos: 0.1

  - name: "pos_8x"
    description: "Position LR at 8x (0.4), others default -- tests the upper bound before instability, maps the curve beyond 4x."
    training:
      learning_rate_pos: 0.4

  # ===== Rotation LR sweep (map curve around 4x winner) ======================

  - name: "rot_2x"
    description: "Rotation LR at 2x (0.01), others default -- tests whether 4x overshot or if the improvement is monotonic."
    training:
      learning_rate_rotation: 0.01

  - name: "rot_8x"
    description: "Rotation LR at 8x (0.04), others default -- tests the upper bound before instability, maps the curve beyond 4x."
    training:
      learning_rate_rotation: 0.04

  # ===== Scale LR reduction (4x diverged, test if less helps) ================

  - name: "scale_05x"
    description: "Scale LR at 0.5x (0.005), others default -- tests whether reducing scale LR improves stability since 4x diverged."
    training:
      learning_rate_scale: 0.005

  - name: "scale_025x"
    description: "Scale LR at 0.25x (0.0025), others default -- tests aggressive scale LR reduction, may prevent oversized Gaussians."
    training:
      learning_rate_scale: 0.0025

  # ===== Weight LR reduction (4x didn't help, test if less helps) ============

  - name: "weight_05x"
    description: "Weight LR at 0.5x (0.025), others default -- tests whether slower weight adaptation yields better density distribution."
    training:
      learning_rate_weight: 0.025

  # ===== Combined experiments (pair individual winners) =======================

  - name: "combo_pos4x_rot4x"
    description: "Position 4x (0.2) + rotation 4x (0.02), others default -- pairs the two best individual improvements from v1 to test if they compound."
    training:
      learning_rate_pos: 0.2
      learning_rate_rotation: 0.02

  - name: "combo_pos4x_rot4x_scale05x"
    description: "Position 4x (0.2) + rotation 4x (0.02) + scale 0.5x (0.005) -- triple combo adding scale reduction to the winning pair."
    training:
      learning_rate_pos: 0.2
      learning_rate_rotation: 0.02
      learning_rate_scale: 0.005
