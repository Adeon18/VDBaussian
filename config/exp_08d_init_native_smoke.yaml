# =============================================================================
# exp_08d_init_native_smoke.yaml  —  Init-count sweep on smoke_plume at native,
#                                     with the AGGRESSIVE ADC preset.
#
# Purpose: Third shape for the generalisation check (after cloud_white in
#          exp_08 and tornado in exp_08c). Smoke plume is a vertically
#          elongated turbulent column — different density distribution from
#          both cloud (blobby) and tornado (thin filaments).
#
#          Same trimmed 4 init counts as exp_08c for speed.
#
# Usage:
#   python experiment_runner.py --batch config/exp_08d_init_native_smoke.yaml
# =============================================================================

global_overrides:
  training:
    max_steps: 3000
  volume:
    vdb_file: "C:\\Users\\ade0n\\Downloads\\Smoke_Plume_01\\Smoke_Plume_01\\embergen_smoke_plume_a_80.vdb"
    up_axis: "-Y"
    use_native_size: true
    tile_size: 8
    max_gaussians_per_tile: 512
  rendering:
    smoke_color: [0.4, 0.4, 0.42]
    density_scale: 50.0
    density_curve: 1.3
    light_penetration: 0.08
    phase_g: 0.55
    sun_direction: [0.5, -1.0, 0.5]
    sun_color: [1.0, 0.8, 0.6]
    sun_intensity: 4.0
    ambient_color: [0.5, 0.55, 0.65]
    ambient_intensity: 0.45
    shadow_steps: 8
  output:
    result_dir: "results/exp_08d_init_native_smoke"
    snapshot_radius: 2.6
  gaussian_init:
    target_count: 15000
    density_weighted: false
    sigma_scale: 1.5
    max_count: 60000
  training:
    adam_beta2: 0.95
    learning_rate_pos: 0.20
    learning_rate_scale: 0.005
    learning_rate_rotation: 0.02
    learning_rate_weight: 0.025
    loss_mode: 0
    ssim_weight: 0.5
  adc:
    max_gaussians: 60000
    clone_n_dense: 1600
    clone_n_sparse: 800
    aniso_n_split: 120
    grad_n_split: 120
    full_adc_every: 100
    prune_only_every: 50
    clone_weight_init_frac: 0.50
    clone_weight_min: 0.10
    clone_weight_max: 0.50


experiments:

  - name: "init_1k_smoke_aggressive"
    description: "Smoke plume native, aggressive ADC, init 1k — max compression attempt."
    gaussian_init:
      target_count: 1000

  - name: "init_5k_smoke_aggressive"
    description: "Smoke plume native, aggressive ADC, init 5k."
    gaussian_init:
      target_count: 5000

  - name: "init_15k_smoke_aggressive"
    description: "Smoke plume native, aggressive ADC, init 15k — reference."
    gaussian_init:
      target_count: 15000

  - name: "init_30k_smoke_aggressive"
    description: "Smoke plume native, aggressive ADC, init 30k."
    gaussian_init:
      target_count: 30000
